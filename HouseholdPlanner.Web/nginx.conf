server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compress on the fly. Not gzip_static here: appsettings.json is rewritten when the container starts, so the
    # gzipped copy that publish made of it is out of date.
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Blazor framework assets are content-addressed — safe to cache forever. ^~ so the file-type rule below, a
    # regex, doesn't take them over. Publish puts a gzipped copy next to each one; serving those cuts the first
    # download from about 9 MB to 3.5 MB.
    location ^~ /_framework/ {
        gzip_static on;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Static assets: return 404 if missing — never fall back to index.html
    # app.css is not fingerprinted so we use no-cache so browsers revalidate on each deploy
    location ~* \.(css|js|wasm|dat|blat|json|ico|png|svg|woff2?|ttf|gif|jpg|jpeg|webp|map)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # nginx has no MIME type for the web app manifest; without this it is served as octet-stream
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # SPA fallback — only for navigation routes
    location / {
        try_files $uri $uri/ /index.html;
        add_header blazor-environment "Production" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
}
